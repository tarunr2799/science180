<!-- Email Header Template - Reusable component -->
<header class="email-header" style="background: linear-gradient(135deg, [primary_color] 0%, [secondary_color] 100%); padding: 40px 30px; text-align: center;">
    <!-- Logo -->
    <div class="header-logo" style="margin-bottom: 20px;">
        <img src="[logo_url]" alt="[company_name]" style="max-width: 150px; height: auto;">
    </div>

    <!-- Header Content Area - to be filled by individual templates -->
    [header_content]

    <!-- Preheader Text (hidden) -->
    <div class="preheader" style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">
        [preheader_text]
    </div>
</header>
